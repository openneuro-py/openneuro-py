pre-commit:
  jobs:
    # Stage 1: Linting
    - name: lint
      group:
        parallel: true
        jobs:
          - name: ruff-lint
            glob: "*.py"
            run: uv run ruff check --fix {staged_files}

          - name: tombi-lint
            glob: "*.toml"
            run: uv run tombi lint {staged_files}

    # Stage 2: Formatting
    - name: format
      group:
        parallel: true
        jobs:
          - name: ruff-format
            glob: "*.py"
            run: uv run ruff format {staged_files}

          - name: tombi-format
            glob: "*.toml"
            run: uv run tombi format {staged_files}

    # Stage 3: Type checking
    - name: type-check
      glob: "src/**/*.py"
      run: uv run ty check {staged_files}

post-merge:
  commands:
    check-deps-changed:
      # We intentionally avoid using lefthook's `files:` and `glob:` directives
      # here and instead run `git diff-tree` directly in the shell script. Using
      # `files:`/`glob:` causes lefthook to run internal `git status`/`git diff`
      # commands that can deadlock with git-lfs hooks holding the index lock.
      run: |
        changed=$(git diff-tree -r --name-only --no-commit-id ORIG_HEAD HEAD -- .python-version pyproject.toml uv.lock)
        if [ -n "$changed" ]; then
          echo ""
          echo "========================================================="
          echo "⚠️ Project definition files have changed:"
          echo ""
          echo "$changed" | while read -r file; do
            echo "   • $file"
          done
          echo ""
          echo "   👉 Run 'uv sync --locked' to update your environment"
          echo "========================================================="
          echo ""
        fi
